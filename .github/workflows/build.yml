name: Build static Studio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p "test_flow_audit.py"
      - run: python3 -m pip install -r benchmarks/requirements.txt
      - run: python3 scripts/flow_audit.py examples/manimgx/pro/quadratic_formula.py --formatted-tokens --format json > /tmp/flow-audit-ci.json
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: arhimed-static
          path: dist
  test-studio:
    name: Browser regression suite (Chrome, mocked cross-origin)
    # Playwright 1.56 does not support ubuntu-26.04 FFmpeg installation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 -m compileall -q examples/manimgx
      - run: npx playwright install --with-deps chrome
      # The whole suite runs here. Two groups are excluded on purpose:
      #   @visual    — pixel baselines recorded on the maintainer's Windows workstation.
      #   @published — drives the deployed GitHub Pages build, not the local one.
      # Keeping an exclusion list instead of an inclusion list means a newly added spec
      # file is covered automatically; forgetting to register it does not hide regressions.
      - name: Run the browser regression suite
        run: npx playwright test --project=chrome --grep-invert "@visual|@published"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          retention-days: 7

  deploy-pages:
    # Publishing is gated on the same checks that protect master: a red suite must not ship.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, test-studio]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arhimed-static
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
